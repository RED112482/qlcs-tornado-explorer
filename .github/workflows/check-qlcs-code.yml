name: QLCS client and processing syntax checks
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python processing scripts
        run: python -m py_compile scripts/process_level2.py scripts/parse_level2_issue.py scripts/process_rap.py scripts/parse_rap_issue.py scripts/process_rap_recent.py
      - name: Exercise latest RAP issue validation
        run: |
          set -e
          REFERENCE="$(date -u +%Y-%m-%dT%H:00Z)"
          export ISSUE_BODY="$(printf 'RAP latest case\nSITE=KMOB\nCYCLE_UTC=%s\nLATEST=1\n' "$REFERENCE")"
          export GITHUB_OUTPUT="$(mktemp)"
          python scripts/parse_rap_issue.py
          grep -qx "site=KMOB" "$GITHUB_OUTPUT"
          grep -qx "latest=1" "$GITHUB_OUTPUT"
          echo "Latest RAP request mode validated"
      - name: Check browser JavaScript syntax
        run: |
          for file in app.js level2.js calendar.js interactions.js motion.js vortex-motion.js; do
            node --check "$file"
          done
      - name: Parse GitHub Actions workflow YAML
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib
          import yaml
          for file in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(file.read_text())
              print("YAML parsed:", file)
          PY
