name: Process NEXRAD Level II
on:
  push:
    branches: [main]
    paths:
      - 'data/level2-request.json'
  workflow_dispatch:
    inputs:
      site:
        description: "Radar site (KMOB, KHDC, KEVX, ...)"
        required: true
        default: "KMOB"
        type: string
      mode:
        description: "Most recent scans, or historical UTC time window"
        required: true
        default: "historical"
        type: choice
        options:
          - historical
          - latest
      start_utc:
        description: "UTC start e.g. 2024-06-04T21:00"
        required: false
        default: "2024-06-04T21:00"
        type: string
      end_utc:
        description: "UTC end e.g. 2024-06-04T22:00 (max 6h)"
        required: false
        default: "2024-06-04T22:00"
        type: string
      max_scans:
        description: "Maximum Level II volumes per run (1–32; 12 recommended)"
        default: "12"
        required: true
        type: string
      rap_profile:
        description: "Attempt optional RAP f00 wind-profile calculation"
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
concurrency:
  group: nexrad-level2-data
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-radar.txt"
      - run: pip install -r requirements-radar.txt
      - name: Resolve scan request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE: ${{ inputs.site }}
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start_utc }}
          END: ${{ inputs.end_utc }}
          LIMIT: ${{ inputs.max_scans }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            SITE=$(python -c "import json;print(json.load(open('data/level2-request.json'))['site'])")
            MODE=historical
            START=$(python -c "import json;print(json.load(open('data/level2-request.json'))['start_utc'])")
            END=$(python -c "import json;print(json.load(open('data/level2-request.json'))['end_utc'])")
            LIMIT=$(python -c "import json;print(json.load(open('data/level2-request.json')).get('max_scans',12))")
          fi
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
      - name: Decode real Level II scans
        env:
          SITE: ${{ steps.request.outputs.site }}
          MODE: ${{ steps.request.outputs.mode }}
          START: ${{ steps.request.outputs.start }}
          END: ${{ steps.request.outputs.end }}
          LIMIT: ${{ steps.request.outputs.limit }}
        run: |
          if [ "$MODE" = "latest" ]; then
            python scripts/process_level2.py --site "$SITE" --latest --max-files "$LIMIT"
          else
            python scripts/process_level2.py --site "$SITE" --start "$START" --end "$END" --max-files "$LIMIT"
          fi
      - name: Optional RAP vertical profile
        if: inputs.rap_profile
        continue-on-error: true
        env:
          SITE: ${{ inputs.site }}
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start_utc }}
        run: |
          if [ "$MODE" = "latest" ]; then
            WHEN=$(date -u '+%Y-%m-%dT%H:00')
          else
            WHEN="$START"
          fi
          python scripts/process_rap.py --site "$SITE" --time "$WHEN"
      - name: Publish generated radar and RAP to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "Publish Level II radar frames and optional RAP winds"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Published processed Level II imagery"
                exit 0
              fi
              echo "Remote moved during publication; retry $attempt"
              sleep $((attempt * 2))
            done
            echo "Could not publish radar frames after retries" >&2
            exit 1
          fi
      - name: Request Pages rebuild after data publication
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Asking GitHub Pages to rebuild after GITHUB_TOKEN-generated data commit."
          gh api --method POST "/repos/$REPO/pages/builds"
