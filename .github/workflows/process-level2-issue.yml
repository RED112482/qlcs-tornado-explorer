name: Process requested historical Level II (GitHub issue)
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: qlcs-level2-issue
  cancel-in-progress: false
jobs:
  archive-request:
    # Never execute arbitrary public issue requests or untrusted user code.
    # Only issues submitted by the OWNER of this repository are allowed.
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[QLCS Level II]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-radar.txt
      - name: Validate trusted issue input
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/parse_level2_issue.py
      - name: Install radar processing dependencies
        run: pip install -r requirements-radar.txt
      - name: Decode Level II native reflectivity and velocity sweeps
        env:
          SITE: ${{ steps.request.outputs.site }}
          START: ${{ steps.request.outputs.start }}
          END: ${{ steps.request.outputs.end }}
          LIMIT: ${{ steps.request.outputs.limit }}
        run: |
          python scripts/process_level2.py --site "$SITE" --start "$START" --end "$END" --max-files "$LIMIT"
      - name: Publish decoded frames and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changed frames"
            exit 0
          fi
          git commit -m "Publish historical Level II reflectivity/velocity from requested UTC case"
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n * 2))
          done
          exit 1
      - name: Request Pages rebuild after data publication
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Asking GitHub Pages to rebuild after GITHUB_TOKEN-generated data commit."
          gh api --method POST "/repos/$REPO/pages/builds"
      - name: Report completed archive request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "✅ Historical Level II reflectivity and lowest-valid radial velocity processed and published. Return to the [QLCS Explorer](https://red112482.github.io/qlcs-tornado-explorer/) and select the same site and UTC time window, then choose **Level II** and **Base Reflectivity** or **Base Radial Velocity**. Velocity is raw and may be aliased."
          gh issue close "$ISSUE" --repo "$REPO" --reason completed
      - name: Report failed archive request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "⚠️ Historical Level II processing did not complete. Review the [workflow log]($RUN_URL). A requested time may not have any archived volumes, or a volume may be unreadable."
